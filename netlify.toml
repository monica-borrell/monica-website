# Netlify configuration for Monica Borrell's personal website
# This is a static site — no build step required.

[build]
  publish = "."

# Cache static assets for performance
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# SPA-style redirect: serve index.html for any path
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
